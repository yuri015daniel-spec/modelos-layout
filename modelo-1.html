<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 2</title>
    <link rel="stylesheet" href="grids.css">
     <style>
        .topo{
            border: 1px solid black;
            margin-bottom: 5px;
        }

        .menu{
            border: 1px solid black;
            height: 300px;
            margin-bottom: 5px;
        }

        .conteudo{
            border: 1px solid black;
            height: 300px;
        }

        .rodape{
            border: 1px solid black;
        }

     </style>
</head>
<body>

    <div class="container">

        <div class="row">
            <div class="col-12 topo">
                <h1>Topo</h1>
            </div>
        </div>

        <div class="row gap-1">
            <div class="col-3 menu">Menu</div>
            <div class="col-9 conteudo">Conteúdo</div>
        </div>

        <div class="row">
            <div class="col-12 rodape">Rodapé</div>
        </div>

    </div>
    
</body>
</html>
