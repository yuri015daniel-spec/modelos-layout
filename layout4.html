<html lang="en">
<head>

    <title>Layout 4</title>
    <link rel="stylesheet" href="grids.css">
     <style>
        .topo{
            border: 1px solid black;

            height: 400px;

        }

        .conteudo{

        }

        .rodape{
            border: 1px solid black;
        }

     </style>
</head>

            <div class="col-3 menu">Menu</div>
            <div class="col-9 menu">Conteúdo</div>
        </div>

        <div class="row gap-1">
            <div class="col-3 conteudo">Menu</div>
            <div class="col-6 conteudo">Conteúdo</div>
            <div class="col-3 conteudo">Conteúdo</div>
        </div>

        <div class="row">
